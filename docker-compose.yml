services:
  app:
    build:
      context: .
    container_name: plato360-app
    environment:
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      HOST: "0.0.0.0"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-plato360-local}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-plato360-local-session-secret}"
      NODE_ENV: "production"
      PORT: "4173"
      WRANGLER_SEND_METRICS: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:4173"
    volumes:
      - plato360-wrangler-state:/app/.wrangler/state
    restart: unless-stopped

volumes:
  plato360-wrangler-state:
